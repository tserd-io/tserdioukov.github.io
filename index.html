&lt;article&gt;&lt;div class=&quot;ex-context&quot;&gt;&lt;p class=&quot;ex-date&quot;&gt;DEC 2022 — MAR 2026&lt;/p&gt;&lt;h2&gt;GenAI document intelligence&lt;/h2&gt;&lt;p class=&quot;ex-company&quot;&gt;Government of Alberta&lt;br&gt;Digital Design &amp;amp; Delivery&lt;/p&gt;&lt;p class=&quot;ex-role&quot;&gt;Senior Data Platform Engineer / AI Engineer&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-work&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;PROJECT DELIVERY&lt;/p&gt;&lt;p&gt;Shipped a production Land Titles document workflow covering intake, field extraction, RAG-backed policy retrieval, LLM-assisted validation, exception routing, human review, and audit-state persistence.&lt;/p&gt;&lt;p&gt;Built evaluation workflows for extraction accuracy, grounding, exception handling, and decision tracing. Established repeatable releases for containerized .NET / GenAI services.&lt;/p&gt;&lt;p class=&quot;ex-tech&quot;&gt;.NET / C# · RAG · AI evaluation · Git · NX · OpenShift&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-impact&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;SCALE &amp;amp; OUTCOME&lt;/p&gt;&lt;strong&gt;45,089&lt;/strong&gt;&lt;p&gt;documents per month, on average&lt;/p&gt;&lt;strong&gt;2K–5K hours/year&lt;/strong&gt;&lt;p&gt;estimated reviewer capacity released&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article&gt;&lt;div class=&quot;ex-context&quot;&gt;&lt;p class=&quot;ex-date&quot;&gt;DEC 2022 — MAR 2026&lt;/p&gt;&lt;h2&gt;Child-care data platform&lt;/h2&gt;&lt;p class=&quot;ex-company&quot;&gt;Government of Alberta&lt;br&gt;Digital Design &amp;amp; Delivery&lt;/p&gt;&lt;p class=&quot;ex-role&quot;&gt;Senior Data Platform Engineer / AI Engineer&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-work&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;PROJECT DELIVERY&lt;/p&gt;&lt;p&gt;Built a cloud-native Azure Databricks platform for child-care analytics and reporting. Delivered governed ETL / ELT pipelines, standardized models, and analytics-grade datasets using medallion architecture.&lt;/p&gt;&lt;p&gt;Introduced schema evolution, change data capture, validation, data dictionaries, and reusable dbt / Kimball reporting contracts. Standardized dozens of program KPIs across 10+ executive-reporting domains.&lt;/p&gt;&lt;p class=&quot;ex-tech&quot;&gt;Azure Databricks · Python · PySpark · SQL · dbt · Kimball&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-impact&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;SCALE &amp;amp; OUTCOME&lt;/p&gt;&lt;strong&gt;$1.558B&lt;/strong&gt;&lt;p&gt;annual program funding supported&lt;/p&gt;&lt;strong&gt;700–1,200 hours/year&lt;/strong&gt;&lt;p&gt;estimated reporting-team time saved&lt;/p&gt;&lt;p class=&quot;ex-note&quot;&gt;Program portfolio included 142,700 licensed spaces.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article&gt;&lt;div class=&quot;ex-context&quot;&gt;&lt;p class=&quot;ex-date&quot;&gt;JUN 2021 — DEC 2022&lt;/p&gt;&lt;h2&gt;Telecom ML &amp;amp; forecasting&lt;/h2&gt;&lt;p class=&quot;ex-company&quot;&gt;Rogers Communications&lt;/p&gt;&lt;p class=&quot;ex-role&quot;&gt;Data Scientist / ML Engineer&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-work&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;PROJECT DELIVERY&lt;/p&gt;&lt;p&gt;Developed models for anomaly detection, service-risk prediction, bandwidth forecasting, segmentation, and recommendations using reusable customer, network, and usage features.&lt;/p&gt;&lt;p&gt;Supported wireless capacity planning against a $1.6B capex base and delivered churn improvements across a large telecom environment.&lt;/p&gt;&lt;p class=&quot;ex-tech&quot;&gt;scikit-learn · PyTorch · TensorFlow · Feature engineering&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-impact&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;SCALE &amp;amp; OUTCOME&lt;/p&gt;&lt;strong&gt;30M+&lt;/strong&gt;&lt;p&gt;customer telecom environment&lt;/p&gt;&lt;strong&gt;0.05 percentage points&lt;/strong&gt;&lt;p&gt;monthly churn improvement&lt;/p&gt;&lt;p class=&quot;ex-note&quot;&gt;Translated to roughly 65K retained customers and $45M in annualized service revenue.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article&gt;&lt;div class=&quot;ex-context&quot;&gt;&lt;p class=&quot;ex-date&quot;&gt;JUN 2021 — DEC 2022&lt;/p&gt;&lt;h2&gt;Telecom interference tool&lt;/h2&gt;&lt;p class=&quot;ex-company&quot;&gt;Rogers Communications&lt;/p&gt;&lt;p class=&quot;ex-role&quot;&gt;Data Scientist / ML Engineer&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-work&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;PROJECT DELIVERY&lt;/p&gt;&lt;p&gt;Led the full development lifecycle of a Node.js telecom interference tool, taking a prototype into production.&lt;/p&gt;&lt;p&gt;Delivered real-time frequency-band analysis and improved backend performance.&lt;/p&gt;&lt;p class=&quot;ex-tech&quot;&gt;Node.js · Real-time analysis · Production application delivery&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-impact&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;OUTCOME&lt;/p&gt;&lt;strong&gt;Prototype → production&lt;/strong&gt;&lt;p&gt;Full lifecycle ownership of a real-time analysis application.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article&gt;&lt;div class=&quot;ex-context&quot;&gt;&lt;p class=&quot;ex-date&quot;&gt;OCT 2019 — MAY 2021&lt;/p&gt;&lt;h2&gt;Quantitative research systems&lt;/h2&gt;&lt;p class=&quot;ex-company&quot;&gt;ElcomQ Corp.&lt;/p&gt;&lt;p class=&quot;ex-role&quot;&gt;Python Engineer / Quantitative Systems Developer&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-work&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;PROJECT DELIVERY&lt;/p&gt;&lt;p&gt;Built financial analytics, market-making, and bid–ask spread-capture systems spanning data ingestion, feature engineering, signal generation, and backtesting.&lt;/p&gt;&lt;p&gt;Applied Monte Carlo methods, stochastic processes, transaction-cost and slippage assumptions, and drawdown analysis. Converted manual spreadsheet analysis into parameterized research and monitoring pipelines.&lt;/p&gt;&lt;p class=&quot;ex-tech&quot;&gt;Python · SQL · VBA · Monte Carlo · Backtesting · Dashboards&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-impact&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;SCALE &amp;amp; OUTCOME&lt;/p&gt;&lt;strong&gt;25–50 instruments&lt;/strong&gt;&lt;p&gt;research coverage across liquid markets&lt;/p&gt;&lt;strong&gt;100K–500K&lt;/strong&gt;&lt;p&gt;bars / ticks per test run&lt;/p&gt;&lt;p class=&quot;ex-note&quot;&gt;Approximately 1–2 seconds interactive dashboard latency.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
&lt;article&gt;&lt;div class=&quot;ex-context&quot;&gt;&lt;p class=&quot;ex-date&quot;&gt;MAY 2018 — AUG 2018&lt;/p&gt;&lt;h2&gt;Enterprise data &amp;amp; reporting&lt;/h2&gt;&lt;p class=&quot;ex-company&quot;&gt;Scotiabank&lt;/p&gt;&lt;p class=&quot;ex-role&quot;&gt;Software Engineer / Data Scientist · Co-op&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-work&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;PROJECT DELIVERY&lt;/p&gt;&lt;p&gt;Integrated five enterprise data-lake sources and transformed datasets containing millions of rows into analytics-ready models.&lt;/p&gt;&lt;p&gt;Automated ETL and recurring refresh workflows, supporting Tableau dashboards for 12+ stakeholders and improving sales-performance data freshness.&lt;/p&gt;&lt;p class=&quot;ex-tech&quot;&gt;Python · PySpark · Pandas · SQL · Tableau&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ex-impact&quot;&gt;&lt;p class=&quot;ex-label&quot;&gt;SCALE &amp;amp; OUTCOME&lt;/p&gt;&lt;strong&gt;30–60 minutes&lt;/strong&gt;&lt;p&gt;refresh and report preparation, down from several manual hours&lt;/p&gt;&lt;strong&gt;~6 hours/week&lt;/strong&gt;&lt;p&gt;manual reporting time saved&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
