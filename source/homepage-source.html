<script>
(()=>{
const root=document.getElementById('motion-portfolio');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
root.querySelectorAll('.mp-page').forEach(page=>{
const canvas=page.querySelector('canvas'),ctx=canvas.getContext('2d'),pause=(page.querySelector('.mp-pause')||document.createElement('button'));
const state={moving:!reduced,speed:1,intensity:.8};let width=0,height=0,time=0,last=0;
const code=page.querySelector('.mp-code');
const snippets=[
'# Explore a dataset\nimport pandas as pd\ndf = pd.read_csv("observations.csv")\nprint(df.shape)\nprint(df.describe().round(2))\nprint(df.isna().sum())\n\n✓ Data profile generated',
'# Clean and engineer features\ndf = df.drop_duplicates()\ndf["date"] = pd.to_datetime(df.date)\ndf["month"] = df.date.dt.month\nX = df.drop(columns=["target", "date"])\ny = df["target"]\n\n✓ Features prepared',
'# Split training and test data\nfrom sklearn.model_selection import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.2,\n    stratify=y, random_state=42)\n\n✓ Holdout set ready',
'# Build a preprocessing pipeline\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.ensemble import RandomForestClassifier\nmodel = make_pipeline(SimpleImputer(),\n    RandomForestClassifier(random_state=42))\nmodel.fit(X_train, y_train)\n✓ Model fitted',
'# Evaluate classifier predictions\nfrom sklearn.metrics import classification_report\ny_pred = model.predict(X_test)\nprint(classification_report(y_test, y_pred))\n\nprecision   recall   f1-score\n   0.91      0.89      0.90\n✓ Evaluation complete',
'# Cross-validate the model\nfrom sklearn.model_selection import cross_val_score\nscores = cross_val_score(\n    model, X_train, y_train, cv=5,\n    scoring="f1_macro")\nprint(scores.mean().round(3))\n\n✓ Five folds evaluated',
'# Search hyperparameters\nfrom sklearn.model_selection import RandomizedSearchCV\nsearch = RandomizedSearchCV(model,\n    {"randomforestclassifier__max_depth": [4, 8, 12]},\n    n_iter=3, cv=3, random_state=42)\nsearch.fit(X_train, y_train)\nprint(search.best_params_)\n✓ Search complete',
'# Visualize feature relationships\nimport seaborn as sns\nimport matplotlib.pyplot as plt\nsns.heatmap(X.corr(numeric_only=True),\n    cmap="Greens", center=0)\nplt.savefig("correlations.png")\n\n✓ Correlation map saved',
'# Cluster standardized observations\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.cluster import KMeans\nZ = StandardScaler().fit_transform(X.dropna())\nclusters = KMeans(n_clusters=4,\n    random_state=42, n_init=10).fit_predict(Z)\n\n✓ Four clusters assigned',
'# Reduce dimensions with PCA\nfrom sklearn.decomposition import PCA\npca = PCA(n_components=2)\nembedding = pca.fit_transform(Z)\nprint(pca.explained_variance_ratio_)\n\n[0.48 0.23]\n✓ Two-dimensional projection ready',
'# Train a neural network\nimport torch\nfor epoch in range(10):\n    optimizer.zero_grad()\n    loss = criterion(net(batch_x), batch_y)\n    loss.backward()\n    optimizer.step()\n✓ Training step complete',
'# Save the trained pipeline\nimport joblib\njoblib.dump(model, "model.joblib")\nloaded = joblib.load("model.joblib")\npredictions = loaded.predict(X_test)\n\n✓ Pipeline saved and reloaded',
'# Run data-quality checks\nassert not df.columns.duplicated().any()\nassert y.notna().all()\nassert len(X) == len(y)\n$ python -m pytest tests/\n\n12 passed in 0.58s\n✓ Checks complete'
];
function render(){page.classList.toggle('mp-paused',!state.moving);pause.textContent=state.moving?'Pause motion':'Play motion';pause.setAttribute('aria-pressed',String(!state.moving));}
pause.addEventListener('click',()=>{state.moving=!state.moving;render()});render();
new ResizeObserver(()=>{width=page.clientWidth;height=page.clientHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=width*d;canvas.height=height*d;ctx.setTransform(d,0,0,d,0,0)}).observe(page);
function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(state.moving&&page.getClientRects().length)time+=dt*state.speed;
if(code){const cycle=Math.floor(time/8)%snippets.length;const progress=time%8;const text=snippets[cycle];const count=reduced?text.length:Math.min(text.length,Math.floor(progress*95));code.textContent=text.slice(0,count)+(count<text.length?'▌':'');code.scrollTop=code.scrollHeight;}
if(width&&height&&page.getClientRects().length){ctx.clearRect(0,0,width,height);const breath=.72+.2*Math.sin(time*.43);const rgb=page.dataset.rgb;
ctx.save();ctx.shadowBlur=0;
for(let star=0;star<82;star++){
const sx=Math.sin(star*127.1+19)*43758.5453;const sy=Math.sin(star*311.7+37)*19341.723;
const x=((sx-Math.floor(sx))*width+time*(.14+star%3*.07))%width;
const y=(sy-Math.floor(sy))*height;
const quiet=Math.abs(x-width*.5)<width*.27&&y<height*.66?.28:1;
const flicker=.65+.35*Math.sin(time*(.22+star%5*.035)+star*2.4);
const bright=star%13===0;const radius=bright?1.25:.55+star%3*.16;
ctx.fillStyle=`rgba(220,231,246,${(bright?.64:.32)*flicker*quiet})`;
ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
if(bright){ctx.strokeStyle=`rgba(210,226,246,${.17*flicker*quiet})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke();}
}
ctx.restore();
if(page.dataset.mode==='code-lines'){
const fragments=['import pandas as pd','model.fit(X_train, y_train)','df.drop_duplicates()','loss.backward()','predict(X_test)','cross_val_score(model, X, y)','SELECT * FROM observations','np.mean(scores)','optimizer.step()','features.transform(X)','train_test_split(X, y)','plt.savefig("results.png")'];
ctx.save();ctx.font='11px monospace';ctx.textBaseline='middle';
for(let lane=0;lane<9;lane++){
const base=height*(.13+lane*.095);const offset=Math.sin(time*.13)*9;
const y=base+offset;const slope=-.14;
const color=lane%3===0?page.dataset.secondary:rgb;
const line=ctx.createLinearGradient(0,0,width,0);line.addColorStop(0,`rgba(${color},.16)`);line.addColorStop(.28,`rgba(${color},.08)`);line.addColorStop(.5,`rgba(${color},.025)`);line.addColorStop(.72,`rgba(${color},.08)`);line.addColorStop(1,`rgba(${color},.16)`);
ctx.strokeStyle=line;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,y+width*.5*slope);ctx.lineTo(width,y-width*.5*slope);ctx.stroke();
for(let packet=0;packet<2;packet++){
const track=width+300;const x=((time*(13+lane%3*4)+lane*133+packet*track/2)%track)-170;const py=y-(x-width*.5)*slope;
const centerFade=Math.abs(x-width*.5)<width*.25&&py<height*.65?.17:1;
ctx.save();ctx.translate(x,py);ctx.rotate(Math.atan(-slope));ctx.fillStyle=`rgba(${color},${.38*state.intensity*centerFade})`;ctx.fillText(fragments[(lane+packet*5)%fragments.length],0,-8);
ctx.fillStyle=`rgba(${color},${.6*state.intensity*centerFade})`;ctx.fillRect(-8,-1,3,3);ctx.restore();
}
